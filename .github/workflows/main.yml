# 天翼云盘自动签到（Go 客户端引擎：cloudpan189-go）
name: 天翼云盘签到

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 1,13 * * *'  # 每天 09:30 和 21:30 (北京时间)
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 签到任务
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      success: ${{ steps.checkin.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cloudpan189-go (v14.4：登录不再依赖网页用户信息接口）
        shell: bash
        run: |
          set -e
          set -x
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          git clone --depth 1 --branch master https://github.com/tickstep/cloudpan189-go.git "$RUNNER_TEMP/cloudpan-src"
          cd "$RUNNER_TEMP/cloudpan-src"
          # ---- 客户端补丁（对象：cloudpan189-go master 克隆件）
          # 第 1 处（v9）：internal/config/pan_config.go 的 ActiveUser() 恢复用户时，
          #   SetupUserByCookie 失败就判死刑（GetUserInfo 是网页接口，依赖网页 cookie，
          #   在 Actions 里时好时坏）。改为：电脑客户端会话（SessionKey）仍在时，
          #   直接以 app 会话恢复已存用户（UID/昵称保留），签到只用 SessionKey。
          # 第 2 处（v9）：main.go 的 checkLoginExpiredAndRelogin() 原来每次调用都重登
          #   （UID != 0 恒真），改为只有确实没有可用用户时才重登。
          # 第 3 处（v10）：internal/config/pan_user.go 的 SetupUserByCookie 里，
          #   GetUserInfo 通过后还要过 GetUserDetailInfo（网页 /v2/ 接口）这一关，
          #   失败照样整个返回错误——#13 实测：前两处补丁生效后，前两关已过，
          #   死在这一关（同一 cookie 几秒前刚通过 GetUserInfo，详情接口却拒，
          #   疑似有并发限制）。改为：详情拉不到但 SessionKey 在，直接返回已构造
          #   的用户（UID/昵称在这一关之前就已写入），性别资料对签到无用。
          # v11 说明：客户端三处补丁一处未动；改动只在 Run checkin 步骤——
          #   签到进程也开 CLOUD189_VERBOSE=1、单独留日志并把脱敏日志尾带进
          #   记录的「签到日志」行，一趟看清死在哪一关（见下方运行步骤注释）。
          python3 - "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" "$RUNNER_TEMP/cloudpan-src/main.go" "$RUNNER_TEMP/cloudpan-src/internal/config/pan_user.go" <<'PYEOF2'
          import sys
          pan_path, main_path, user_path = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(pan_path).read()
          old_a = '\t\t\t\tif u.PanClient() == nil {\n\t\t\t\t\t// restore client\n\t\t\t\t\tuser, err := SetupUserByCookie(&u.WebToken, &u.AppToken)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\tlogger.Verboseln("setup user error")\n\t\t\t\t\t\treturn nil\n\t\t\t\t\t}\n\t\t\t\t\tu.panClient = user.panClient\n\t\t\t\t\tu.Nickname = user.Nickname\n'
          new_a = '\t\t\t\tif u.PanClient() == nil {\n\t\t\t\t\t// restore client\n\t\t\t\t\tuser, err := SetupUserByCookie(&u.WebToken, &u.AppToken)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\t// 网页侧校验失败时，若电脑客户端会话仍在，直接以 app 会话恢复：\n\t\t\t\t\t\t// 签到只用 SessionKey，不依赖网页 cookie；这里返回已存的用户\n\t\t\t\t\t\t//（UID 与昵称都保留），而不是在恢复处就判死刑\n\t\t\t\t\t\tif u.AppToken.SessionKey != "" {\n\t\t\t\t\t\t\tlogger.Verboseln("setup user by cookie failed, restore with app session only")\n\t\t\t\t\t\t\tu.panClient = cloudpan.NewPanClient(u.WebToken, u.AppToken)\n\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\tlogger.Verboseln("setup user error")\n\t\t\t\t\t\t\treturn nil\n\t\t\t\t\t\t}\n\t\t\t\t\t} else {\n\t\t\t\t\t\tu.panClient = user.panClient\n\t\t\t\t\t\tu.Nickname = user.Nickname\n\t\t\t\t\t}\n'
          if src.count(old_a) != 1:
              sys.exit('pan_config.go: 恢复兜底锚点未命中，中止')
          open(pan_path, 'w').write(src.replace(old_a, new_a))
          print('pan_config.go: 恢复兜底已应用')
          src = open(main_path).read()
          old_b = '\tactiveUser := config.Config.ActiveUser()\n\tif activeUser == nil || activeUser.UID != 0 {\n\t\t// maybe expired, try to login\n\t\tcmder.TryLogin()\n\t}\n'
          new_b = '\tactiveUser := config.Config.ActiveUser()\n\tif activeUser == nil {\n\t\t// 只有确实没有可用用户时才重登：已存用户不要每次都重登——\n\t\t// 新登录会顶掉已存的网页会话，且其网页兜底本就时好时坏；\n\t\t// 自动化流程里登录步骤已在签到前刚刷新过会话，这里不再动它\n\t\tcmder.TryLogin()\n\t}\n'
          if src.count(old_b) != 1:
              sys.exit('main.go: 重登条件锚点未命中，中止')
          open(main_path, 'w').write(src.replace(old_b, new_b))
          print('main.go: 重登条件已收紧')
          src = open(user_path).read()
          old_c = '\tuserDetailInfo, err := panClient.GetUserDetailInfo()\n\tif userDetailInfo != nil {\n'
          new_c = '\tuserDetailInfo, err := panClient.GetUserDetailInfo()\n\tif userDetailInfo == nil && appToken.SessionKey != "" {\n\t\t// 网页侧详情接口失败但电脑客户端会话仍在：不要判死刑——\n\t\t// 签到只用 SessionKey，性别等资料对签到无用，直接以 app 会话返回用户\n\t\tlogger.Verboseln("get user detail info failed, continue with app session only")\n\t\treturn u, nil\n\t}\n\tif userDetailInfo != nil {\n'
          if src.count(old_c) != 1:
              sys.exit('pan_user.go: 详情关口锚点未命中，中止')
          open(user_path, 'w').write(src.replace(old_c, new_c))
          print('pan_user.go: 详情关口兜底已应用')
          src = open(user_path).read()
          if 'func (pu *PanUser) SetPanClient(' in src:
              sys.exit('pan_user.go: SetPanClient 已存在，中止')
          src += '\n// SetPanClient v14 追加：供登录命令在构造用户后注入客户端\nfunc (pu *PanUser) SetPanClient(client *cloudpan.PanClient) {\n\tpu.panClient = client\n}\n'
          open(user_path, 'w').write(src)
          print('pan_user.go: SetPanClient 已追加')
          PYEOF2
          grep -q 'restore with app session only' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" || { echo "❌ 恢复兜底缺失，中止"; exit 1; }
          grep -q 'if activeUser == nil {' "$RUNNER_TEMP/cloudpan-src/main.go" || { echo "❌ 重登条件未收紧，中止"; exit 1; }
          grep -q 'get user detail info failed, continue with app session only' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_user.go" || { echo "❌ 详情关口兜底缺失，中止"; exit 1; }
          grep -q 'func (pu \*PanUser) SetPanClient(' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_user.go" || { echo "❌ SetPanClient 缺失，中止"; exit 1; }
          echo "✅ 客户端三处补丁已应用（恢复兜底 + 重登收紧 + 详情关口兜底）"
          # ---- 第 4 处（v12）：internal/command/user_sign.go 的 sign 动作开头加一行
          #   无条件打印的诊断标记（fmt.Printf，不受 verbose 开关影响）：
          #   users/activeUID/skLen/ckLen —— #15 的教训是 verbose 行在 sign 进程的
          #   日志里只剩启动期的配置目录两行，恢复链的 verbose 标记一行没出，
          #   无法区分「没走到恢复」与「标记没打」。这一行由签到动作本体无条件
          #   打印：若它出现，说明配置已读入、就差 ActiveUser() 判定；若它不
          #   出现，说明死在更上游的启动重登关口，与恢复链无关。
          python3 - "$RUNNER_TEMP/cloudpan-src/internal/command/user_sign.go" <<'PYEOF3'
          import sys
          p = sys.argv[1]
          src = open(p).read()
          old7 = '\t\tAction: func(c *cli.Context) error {\n\t\t\tif config.Config.ActiveUser() == nil {\n'
          new7 = '\t\tAction: func(c *cli.Context) error {\n\t\t\t{\n\t\t\t\t_users := config.Config.UserList\n\t\t\t\t_sk, _ck := 0, 0\n\t\t\t\tif len(_users) > 0 {\n\t\t\t\t\t_sk = len(_users[0].AppToken.SessionKey)\n\t\t\t\t\t_ck = len(_users[0].WebToken.CookieLoginUser)\n\t\t\t\t}\n\t\t\t\tfmt.Printf("sign diag: users=%d activeUID=%d skLen=%d ckLen=%d\\n", len(_users), config.Config.ActiveUID, _sk, _ck)\n\t\t\t}\n\t\t\tif config.Config.ActiveUser() == nil {\n'
          if src.count(old7) != 1:
              sys.exit('user_sign.go: 诊断标记锚点未命中，中止')
          open(p, 'w').write(src.replace(old7, new7))
          print('user_sign.go: 签到诊断标记已应用')
          PYEOF3
          grep -q 'sign diag: users=' "$RUNNER_TEMP/cloudpan-src/internal/command/user_sign.go" || { echo "❌ 签到诊断标记缺失，中止"; exit 1; }
          echo "✅ v12 签到诊断标记已应用"
          # ---- 第 5 处（v14）：internal/command/login.go 的 CmdLogin 动作——
          #   #17 实证：探头登录打印「天翼帐号登录成功」后，配置文件仍是出厂
          #   空状态（355 字节 users=0）。根源在登录动作后半截：RunLogin 拿到
          #   app 会话后还要 SetupUserByCookie 走网页 getUserInfoForPortal 拿
          #   UID——UID 来自该接口的 domainName 字段，现已不回此值（或回0），
          #   于是 user.UID=0 → ActiveUID=0 → ActiveUser() 恒 nil → 保存被
          #   跳过、内存用户也判「未登录」；链式那趟更死在网页兜底直登上。
          #   改法：RunLogin 成功后，不再调 SetupUserByCookie，直接用 appToken
          #   构造 PanClient，跳过网页用户信息/详情两关，UID 用固定非零占位
          #   1890001（仅本地索引用，签到与抽奖都不读它），然后加密保存账密
          #   并 SetActiveUser —— 登录落盘不再依赖任何网页接口。
          curl -fsSL "https://raw.githubusercontent.com/tickstep/cloudpan189-api/v0.1.0/cloudpan/pan_client.go" -o "$RUNNER_TEMP/pan_client.go.orig"
          cp "$RUNNER_TEMP/cloudpan-src/internal/command/login.go" "$RUNNER_TEMP/login_cmd.go.orig"
          python3 - "$RUNNER_TEMP/cloudpan-src/internal/command/login.go" "$LIBDIR/pan_client.go" "$RUNNER_TEMP/login_cmd.go.orig" "$RUNNER_TEMP/pan_client.go.orig" <<'PYEOF4'
          import sys
          login_path, client_path, login_orig_path, client_orig_path = sys.argv[1:5]
          if open(login_path).read() != open(login_orig_path).read():
              sys.exit('login.go: 与已审计基线不一致，中止')
          if open(client_path).read() != open(client_orig_path).read():
              sys.exit('pan_client.go: 与 v0.1.0 已审计基线不一致，中止')
          src = open(login_path).read()
          old_block = '\t\t\tcloudUser, _ := config.SetupUserByCookie(&webToken, &appToken)\n\t\t\t// save username / password\n\t\t\tcloudUser.LoginUserName = config.EncryptString(username)\n\t\t\tcloudUser.LoginUserPassword = config.EncryptString(passowrd)\n\t\t\tconfig.Config.SetActiveUser(cloudUser)\n\t\t\tfmt.Println("天翼帐号登录成功: ", cloudUser.Nickname)\n'
          new_block = '\t\t\t// v14: 不再走 SetupUserByCookie 的网页用户信息关口（UID 取自\n\t\t\t// getUserInfoForPortal 的 domainName，现已不回值，UID 恒 0 导致\n\t\t\t// 登录状态无法落盘）。直接以 app 会话构造用户：签到只用\n\t\t\t// SessionKey/SessionSecret，抽奖只用 CookieLoginUser，UID 仅作\n\t\t\t// 本地索引，用固定非零占位。\n\t\t\tcloudUser := &config.PanUser{\n\t\t\t\tUID: 1890001,\n\t\t\t\tNickname: username,\n\t\t\t\tAccountName: username,\n\t\t\t\tWebToken: webToken,\n\t\t\t\tAppToken: appToken,\n\t\t\t}\n\t\t\tcloudUser.SetPanClient(cloudpan.NewPanClient(webToken, appToken))\n\t\t\t// save username / password\n\t\t\tcloudUser.LoginUserName = config.EncryptString(username)\n\t\t\tcloudUser.LoginUserPassword = config.EncryptString(passowrd)\n\t\t\tconfig.Config.SetActiveUser(cloudUser)\n\t\t\tfmt.Println("天翼帐号登录成功: ", cloudUser.Nickname)\n'
          if src.count(old_block) != 1:
              sys.exit('login.go: v14 改造锚点未命中，中止')
          open(login_path, 'w').write(src.replace(old_block, new_block))
          print('login.go: v14 app 会话直构用户已应用')
          csrc = open(client_path).read()
          marker = 'func NewPanClient(webToken WebLoginToken, appToken AppLoginToken) *PanClient {'
          if csrc.count(marker) != 1:
              sys.exit('pan_client.go: NewPanClient 锚点未命中，中止')
          add = marker + '\n\tclient.EnableAppSessionFallback()'
          open(client_path, 'w').write(csrc.replace(marker, add))
          print('pan_client.go: app 会话 cookie 兜底挂钩已应用')
          PYEOF4
          grep -q 'UID: 1890001' "$RUNNER_TEMP/cloudpan-src/internal/command/login.go" || { echo "❌ v14 登录改造缺失，中止"; exit 1; }
          grep -q 'EnableAppSessionFallback' "$LIBDIR/pan_client.go" || { echo "❌ v14 cookie 兜底挂钩缺失，中止"; exit 1; }
          echo "✅ v14 登录改造已应用（跳过网页用户信息关口，app 会话直构用户）"
          # ---- 第 7 处（v14.1）：internal/config/pan_config.go 的 ActiveUser()——
          #   对已应用第 1 处补丁的文本再动刀：恢复用户时 u.PanClient()==nil
          #   原走 SetupUserByCookie，其 GetUserInfo 的 UID 读自网页回信的
          #   domainName 并 ParseInt——该字段现装带点域名，解析恒 0，新构造的
          #   用户反被 UID=0 的「成功结果」替换，ActiveUser() 照样返回 nil。
          #   改为：SessionKey 在就直接用已存令牌 NewPanClient 恢复并保留
          #   已存 UID/昵称；仅无 SessionKey 时才走老路（其 err 分支保留 v9
          #   兜底结构，用 else-if 承接，括号与原结构严丝合缝）。
          python3 - "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" <<'PYEOF5'
          import sys
          p = sys.argv[1]
          src = open(p).read()
          old_r = '\t\t\t\t\tuser, err := SetupUserByCookie(&u.WebToken, &u.AppToken)\n\t\t\t\t\tif err != nil {\n'
          new_r = '\t\t\t\t\tif u.AppToken.SessionKey != "" {\n\t\t\t\t\t\t// v14.1: 网页用户信息接口的 UID 来源（domainName）已变样，\n\t\t\t\t\t\t// 恢复时不再走 SetupUserByCookie，直接以已存 app 会话恢复，\n\t\t\t\t\t\t// UID/昵称保留存档原值\n\t\t\t\t\t\tu.panClient = cloudpan.NewPanClient(u.WebToken, u.AppToken)\n\t\t\t\t\t} else if user, err := SetupUserByCookie(&u.WebToken, &u.AppToken); err != nil {\n'
          if src.count(old_r) != 1:
              sys.exit('pan_config.go: v14.1 恢复短路锚点未命中，中止')
          open(p, 'w').write(src.replace(old_r, new_r))
          print('pan_config.go: v14.1 恢复短路已应用')
          PYEOF5
          grep -q 'v14.1: 网页用户信息接口的 UID 来源' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" || { echo "❌ v14.1 恢复短路缺失，中止"; exit 1; }
          echo "✅ v14.1 恢复短路已应用（恢复用户不再走网页用户信息接口）"
          # --- 补丁总览（对象：cloudpan189-api v0.1.0，已审计版本）
          # 第一层（v7）：两个登录参数刮取器共 10 处 FindStringSubmatch(content)[1]
          #   无保护，页面缺字段即崩（index out of range [1]）→ 全部改为带长度保护。
          # 第二层（v8 新增）：login.go 的 LoginWithCaptcha 在 doLoginAct 返回
          #   (nil 结果, nil 错误) 时 err.Error() 解引用空指针崩溃 → 先判 err、
          #   再单独判结果为空，改为干净返回登录失败。
          # 第三层（v8 新增）：appGetLoginParams 整体加 recover 兜底 + 必需字段
          #   （jRsaKey/Lt/ReturnUrl/ParamId/ReqId）缺一即返回「登录参数不完整」错误，
          #   不再带着空参数往下走、把小问题拖成崩溃。
          curl -fsSL "https://raw.githubusercontent.com/tickstep/cloudpan189-api/v0.1.0/cloudpan/app_login.go" -o "$RUNNER_TEMP/app_login.go"
          curl -fsSL "https://raw.githubusercontent.com/tickstep/cloudpan189-api/v0.1.0/cloudpan/login.go" -o "$RUNNER_TEMP/login.go"
          GOMODCACHE="$(go env GOMODCACHE)"
          LIBDIR="$GOMODCACHE/github.com/tickstep/cloudpan189-api@v0.1.0/cloudpan"
          if [ ! -f "$LIBDIR/pan_client.go" ]; then (cd "$RUNNER_TEMP/cloudpan-src" && go mod download github.com/tickstep/cloudpan189-api); fi
          [ -f "$LIBDIR/pan_client.go" ] || { echo "❌ cloudpan189-api v0.1.0 源码仍未就位，中止"; exit 1; }
          [ -d "$LIBDIR" ] || { echo "❌ 找不到 cloudpan189-api v0.1.0 源码目录，补丁中止"; exit 1; }
          chmod -R u+w "$GOMODCACHE/github.com/tickstep/cloudpan189-api@v0.1.0"
          cp "$RUNNER_TEMP/app_login.go" "$LIBDIR/app_login.go"
          cp "$RUNNER_TEMP/login.go" "$LIBDIR/login.go"
          python3 - "$LIBDIR/app_login.go" 6 "$LIBDIR/login.go" 4 <<'PYEOF'
          import re, sys
          args = sys.argv[1:]
          PAT = re.compile(r'^\tparams\.(\w+) = re\.FindStringSubmatch\(content\)\[1\]$')
          for i in range(0, len(args), 2):
              path, expect = args[i], int(args[i+1])
              out, n = [], 0
              for line in open(path).read().split('\n'):
                  m = PAT.match(line)
                  if m:
                      f = m.group(1)
                      out.append('\tif m := re.FindStringSubmatch(content); len(m) > 1 {')
                      out.append('\t\tparams.%s = m[1]' % f)
                      out.append('\t}')
                      n += 1
                  else:
                      out.append(line)
              if n != expect:
                  sys.exit('%s: 预期补丁 %d 处，实际 %d 处，中止' % (path, expect, n))
              open(path, 'w').write('\n'.join(out))
              print('%s: 已加保护 %d 处' % (path, n))
          # ---- v8 第二层：LoginWithCaptcha 空指针守卫（login.go）----
          login_path = args[2]
          src = open(login_path).read()
          old = '\tr, err := doLoginAct(username, password, captchaCode, latestLoginParams.CaptchaToken,\n\t\tlatestLoginParams.ReturnUrl, latestLoginParams.ParamId, latestLoginParams.Lt)\n\tif err != nil || r.Msg != "登录成功" {\n\t\tlogger.Verboseln("login failed ", err)\n\t\treturn webToken, apierror.NewFailedApiError(err.Error())\n\t}'
          new = '\tr, err := doLoginAct(username, password, captchaCode, latestLoginParams.CaptchaToken,\n\t\tlatestLoginParams.ReturnUrl, latestLoginParams.ParamId, latestLoginParams.Lt)\n\tif err != nil {\n\t\tlogger.Verboseln("login failed ", err)\n\t\treturn webToken, apierror.NewFailedApiError(err.Error())\n\t}\n\tif r == nil || r.Msg != "登录成功" {\n\t\tlogger.Verboseln("login failed: unexpected result")\n\t\treturn webToken, apierror.NewFailedApiError("登录失败")\n\t}'
          if src.count(old) != 1:
              sys.exit('login.go: 空指针守卫锚点未命中，中止')
          open(login_path, 'w').write(src.replace(old, new))
          print('login.go: 空指针守卫已应用')
          # ---- v8 第三层：appGetLoginParams recover + 必需字段校验（app_login.go）----
          app_path = args[0]
          src = open(app_path).read()
          anchor = '\tcontent := string(data)\n\n\tre, _ := regexp.Compile("captchaToken\' value=\'(.+?)\'")'
          repl = '\tcontent := string(data)\n\tdefer func() {\n\t\tif rec := recover(); rec != nil {\n\t\t\tparams = appLoginParams{}\n\t\t\terror = apierror.NewFailedApiError("登录参数抓取异常")\n\t\t}\n\t}()\n\n\tre, _ := regexp.Compile("captchaToken\' value=\'(.+?)\'")'
          if src.count(anchor) != 1:
              sys.exit('app_login.go: recover 锚点未命中，中止')
          src = src.replace(anchor, repl)
          tail = '\tparams.jRsaKey = m[1]\n\t}\n\treturn\n}'
          tail_new = '\tparams.jRsaKey = m[1]\n\t}\n\tif params.jRsaKey == "" || params.Lt == "" || params.ReturnUrl == "" || params.ParamId == "" || params.ReqId == "" {\n\t\treturn params, apierror.NewFailedApiError("登录参数不完整")\n\t}\n\treturn\n}'
          if src.count(tail) != 1:
              sys.exit('app_login.go: 字段校验锚点未命中，中止')
          open(app_path, 'w').write(src.replace(tail, tail_new))
          print('app_login.go: recover 兜底 + 必需字段校验已应用')
          PYEOF
          if grep -rn "FindStringSubmatch(content)\[1\]" "$LIBDIR/app_login.go" "$LIBDIR/login.go" > /dev/null; then
            echo "❌ 仍有未加保护的抓取，补丁不完整，中止"
            exit 1
          fi
          grep -q 'r == nil || r.Msg' "$LIBDIR/login.go" || { echo "❌ 空指针守卫缺失，中止"; exit 1; }
          grep -q '登录参数不完整' "$LIBDIR/app_login.go" || { echo "❌ 字段校验缺失，中止"; exit 1; }
          echo "✅ 基线补丁已全部应用（客户端 3 处 + 签到诊断标记 + 抓取保护 10 处 + 空指针守卫 + recover/字段校验）"
          # ---- 客户端补丁第 6 处（v14）：cloudpan189-api 的 pan_client.go 末尾追加
          #   EnableAppSessionFallback —— NewPanClient 造的网页 client 原本只带
          #   COOKIE_LOGIN_USER 一只 cookie；该值为空时（SSO 换 cookie 现已不稳），
          #   用 app 会话（SessionKey）经 ssoLogin.action 换到 cookie 并塞回 jar，
          #   仍为空则用 SessionKey 本身兜底。抽奖走网页 client 的 cookie 通道，
          #   这是它在新登录形态下能工作的前提。补丁后把改过的 api 源码放进
          #   克隆件内的本地目录，并用 go.mod replace 指向它——直接改模块缓存
          #   会被 go 的校验和校验拒绝（v7–v13 的老补丁在缓存里的命运即将由
          #   本版的构建结果验证：若构建因校验和失败，说明老路已断，本版的
          #   replace 正是对策；若构建通过，replace 同样保证补丁必达）。
          cat >> "$LIBDIR/pan_client.go" <<'GOEOF'

          // EnableAppSessionFallback v14 追加：网页 client 的 cookie 为空时，
          // 用 app 会话换取 COOKIE_LOGIN_USER 并塞回 cookie jar；换不到则以
          // SessionKey 本身兜底，保证抽奖等网页接口至少带着会话去试。
          func (p *PanClient) EnableAppSessionFallback() {
              if p.webToken.CookieLoginUser != "" || p.appToken.SessionKey == "" {
                  return
              }
              cookie := RefreshCookieToken(p.appToken.SessionKey)
              if cookie == "" {
                  cookie = p.appToken.SessionKey
              }
              p.webToken.CookieLoginUser = cookie
              p.client.Jar.SetCookies(cloudpanDomainUrl, []*http.Cookie{
                  &http.Cookie{
                      Name:   "COOKIE_LOGIN_USER",
                      Value:  cookie,
                      Domain: "cloud.189.cn",
                      Path:   "/",
                  },
              })
          }
          GOEOF
          grep -q 'func (p \*PanClient) EnableAppSessionFallback' "$LIBDIR/pan_client.go" || { echo "❌ v14 cookie 兜底函数缺失，中止"; exit 1; }
          echo "✅ v14 app 会话 cookie 兜底已应用"
          mkdir -p "$RUNNER_TEMP/cloudpan-src/apilocal"
          cp -r "$GOMODCACHE/github.com/tickstep/cloudpan189-api@v0.1.0/." "$RUNNER_TEMP/cloudpan-src/apilocal/"
          chmod -R u+w "$RUNNER_TEMP/cloudpan-src/apilocal"
          go mod edit -replace github.com/tickstep/cloudpan189-api="$RUNNER_TEMP/cloudpan-src/apilocal"
          echo "✅ go.mod replace 已指向本地已补丁 api 源码"
          # v14.1 复盘修正：replace 到本地目录后，apilocal/go.mod 里写着
          # go 1.12 且自带 require 集合，与主模块（library-go v0.1.1）不一致，
          # 默认 -mod=readonly 会直接拒绝构建。放开为 -mod=mod 并跑一遍
          # go mod tidy，让依赖图现算现写；构建日志里也会留下完整轨迹。
          export GOFLAGS=-mod=mod
          go mod tidy
          echo "✅ go mod tidy 完成（依赖图已按本地 replace 重算）"
          go build -o "$RUNNER_TEMP/cloudpan189-go" .

      - name: Run checkin
        id: checkin
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          CLOUD189_CONFIG_DIR: ${{ runner.temp }}/cloud189-config
        run: |
          START_TS=$(date +%s)
          START_STR=$(date '+%Y-%m-%d %H:%M:%S')
          BIN="$RUNNER_TEMP/cloudpan189-go"

          # 登录 + 签到 + 抽奖（v11：链式调用与整链重试 3 次不变；
          # 修复都在 Build 步骤的补丁里——v7/v8 的抓取保护、空指针守卫、
          # recover/字段校验不变；v9 补「恢复时网页校验失败走 app 会话兜底 +
          # 仅无用户时重登」；v10 再补「详情关口同样兜底」。
          # v11 只改观测：签到进程也开 CLOUD189_VERBOSE=1、单独写入 SIGN_LOG，
          # 并把脱敏日志尾带进记录的「签到日志」行——死在哪一关一趟看清，
          # 不再靠猜。
          # v12 只加一处观测（在 Build 步骤）：sign 动作开头无条件打印
          # v13 新增：#16 的 sign diag 是 users=0/activeUID=0/skLen=0/ckLen=0
          # ——签到进程看到的是一份空配置。于是 v13 直接把配置文件本身亮出来：
          # 探头登录后、链式登录后各拍一张快照（只记个数与长度+文件字节数，
          # 不记内容），并把链式登录原本丢进 /dev/null 的输出留档脱敏带进记录。
          # 三个时点一比就知道登录状态死在哪一手：没落盘 / 落盘后被清 / 都在。
          # 「sign diag: users=.. activeUID=.. skLen=.. ckLen=..」——#15 实测
          # verbose 标记在 sign 进程里没出全，这一行不受 verbose 影响，
          # 出现与否直接区分「死在启动重登关口」还是「死在签到恢复判定」。）
          CHAIN_LOG="$RUNNER_TEMP/chain.log"
          SIGN_LOG="$RUNNER_TEMP/sign-verbose.log"
          : > "$CHAIN_LOG"
          : > "$SIGN_LOG"
          LOGIN_OK=false
          for attempt in 1 2; do
            CLOUD189_VERBOSE=1 "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > "$CHAIN_LOG" 2>&1 || true
            if grep -q "登录成功" "$CHAIN_LOG"; then
              LOGIN_OK=true
              break
            fi
            sleep 5
          done
          # v13 配置文件快照函数：只报个数/长度/字节数，绝不输出令牌内容
          cfg_snapshot() {
            python3 - "$CLOUD189_CONFIG_DIR/cloud189_config.json" <<'PYEOF_CFG'
          import json, sys, os
          p = sys.argv[1]
          try:
              raw = open(p, 'rb').read()
          except FileNotFoundError:
              print('cfgfile=MISSING'); sys.exit(0)
          try:
              cfg = json.loads(raw)
          except Exception:
              print('cfgfile=UNPARSEABLE size=%d' % len(raw)); sys.exit(0)
          ul = cfg.get('userList') or []
          sk = ck = 0
          if ul:
              sk = len((ul[0].get('appToken') or {}).get('sessionKey') or '')
              ck = len((ul[0].get('webToken') or {}).get('cookieLoginUser') or '')
          print('users=%d activeUID=%s skLen=%d ckLen=%d size=%d' % (len(ul), cfg.get('activeUID', 0), sk, ck, len(raw)))
          PYEOF_CFG
          }
          CFG_AFTER_LOGIN=""
          if [ "$LOGIN_OK" = "true" ]; then
            CFG_AFTER_LOGIN=$(cfg_snapshot)
          fi
          if [ "$LOGIN_OK" = "true" ]; then
            LOGIN_STATUS="登录成功"
            CHAIN_LOGIN_LOG="$RUNNER_TEMP/chain-login.log"
            CFG_BEFORE_SIGN=""
            for attempt in 1 2 3; do
              "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > "$CHAIN_LOGIN_LOG" 2>&1 && CFG_BEFORE_SIGN=$(cfg_snapshot) && CLOUD189_VERBOSE=1 "$BIN" sign > "$SIGN_LOG" 2>&1 || true
              cat "$SIGN_LOG" >> "$CHAIN_LOG"
              if grep -a -q -E "签到成功|今日已签到|签到失败" "$CHAIN_LOG"; then
                break
              fi
              sleep 5
            done
          else
            LOGIN_STATUS="登录失败"
          fi
          cp "$CHAIN_LOG" "$RUNNER_TEMP/login.log"
          cp "$CHAIN_LOG" "$RUNNER_TEMP/sign.log"
          LOGIN_REASON=""
          if [ "$LOGIN_STATUS" = "登录失败" ]; then
            LOGIN_REASON=$(grep -a -E "panic:|APP登录失败|loginResult|登录失败" "$RUNNER_TEMP/login.log" | tail -2 | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
            echo "----- 登录失败日志（已打码，末尾20行） -----"
            tail -20 "$RUNNER_TEMP/login.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "---------------------------------------------"
          fi

          # 签到结果提取（v4：签到已在上面的链式调用里执行完，这里只从链日志里提取结果行；
          # 「未登录账号」视为链断裂的异常信号，原样记进签到输出备查）
          SIGN_RESULT=""
          SIGN_DETAIL=""
          DRAW1=""
          DRAW2=""
          if [ "$LOGIN_STATUS" = "登录成功" ]; then
            SIGN_RESULT=$(grep -a -E "签到成功|今日已签到|签到失败" "$RUNNER_TEMP/sign.log" | head -n 1)
            echo "----- 签到输出（已打码，末尾10行） -----"
            tail -10 "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "-----------------------------------------"
            if [ -z "$SIGN_RESULT" ]; then
              SIGN_RESULT="签到失败（无输出）"
              PANIC_HEAD=$(grep -a -m1 -E "^panic:|^fatal error:" "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              if [ -n "$PANIC_HEAD" ]; then
                SIGN_DETAIL="$PANIC_HEAD"
              else
                SIGN_DETAIL=$(tail -5 "$RUNNER_TEMP/sign.log" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              fi
            fi
            DRAW1=$(grep -a -E "第1次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
            DRAW2=$(grep -a -E "第2次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
          fi
          # v13：链式登录的输出尾（脱敏）——它此前被丢进 /dev/null，这次留档
          CHAIN_LOGIN_TAIL=""
          if [ -s "$RUNNER_TEMP/chain-login.log" ]; then
            CHAIN_LOGIN_TAIL=$(tail -5 "$RUNNER_TEMP/chain-login.log" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-400)
          fi
          SIGN_DIAG=$(grep -a -m1 "sign diag:" "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-200)
          # v11 诊断：签到进程的 verbose 日志尾（脱敏）带进记录，一趟看清死点
          SIGN_TAIL=""
          if [ -s "$SIGN_LOG" ]; then
            SIGN_TAIL=$(tail -8 "$SIGN_LOG" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-500)
          fi

          END_TS=$(date +%s)
          END_STR=$(date '+%Y-%m-%d %H:%M:%S')
          DURATION=$((END_TS - START_TS))

          {
            echo "# 天翼云盘签到记录"
            echo ""
            echo "[![签到状态](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/main.yml) [![项目主页](https://img.shields.io/badge/GitHub-项目主页-blue?logo=github)](https://github.com/${{ github.repository }})"
            echo ""
            echo "**最后更新:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
            echo "## 快速导航"
            echo ""
            echo "- 🔄 [查看Action运行记录](https://github.com/${{ github.repository }}/actions)"
            echo "- 📋 [查看最新运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 🏠 [返回项目主页](https://github.com/${{ github.repository }})"
            echo "- ⚙️ [手动触发签到](https://github.com/${{ github.repository }}/actions/workflows/main.yml)"
            echo ""
            echo "## 签到详情"
            echo ""
            echo "# 天翼云盘自动签到抽奖程序"
            echo ""
            echo "## 执行概览"
            echo "- **启动时间**: $START_STR"
            echo "- **账户数量**: 1 个"
            echo ""
            echo "## 账户1"
            echo ""
            echo "### 执行结果"
            echo "- **登录状态**: $LOGIN_STATUS"
            if [ "$LOGIN_STATUS" = "登录失败" ] && [ -n "$LOGIN_REASON" ]; then
              echo "- **失败原因**: $LOGIN_REASON"
            fi
            echo "- **签到结果**: $SIGN_RESULT"
            if [ -n "$SIGN_DETAIL" ]; then
              echo "- **签到输出**: $SIGN_DETAIL"
            fi
            if [ -n "$SIGN_DIAG" ]; then
              echo "- **签到诊断**: $SIGN_DIAG"
            fi
            if [ -n "$CFG_AFTER_LOGIN" ]; then
              echo "- **登录后配置**: $CFG_AFTER_LOGIN"
            fi
            if [ -n "$CFG_BEFORE_SIGN" ]; then
              echo "- **签到前配置**: $CFG_BEFORE_SIGN"
            fi
            if [ -n "$CHAIN_LOGIN_TAIL" ]; then
              echo "- **链式登录输出**: $CHAIN_LOGIN_TAIL"
            fi
            if [ -n "$SIGN_TAIL" ]; then
              echo "- **签到日志**: $SIGN_TAIL"
            fi
            if [ -n "$DRAW1" ] || [ -n "$DRAW2" ]; then
              echo "- **抽奖结果**:"
              if [ -n "$DRAW1" ]; then
                echo "  - $DRAW1"
              fi
              if [ -n "$DRAW2" ]; then
                echo "  - $DRAW2"
              fi
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 执行统计"
            echo "- **结束时间**: $END_STR"
            echo "- **运行时长**: ${DURATION} 秒"
            echo ""
            echo "✅ **所有账户处理完成！**"
          } | tee index.md

          if echo "$SIGN_RESULT" | grep -qE "签到成功|今日已签到"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit message
        id: commit_msg
        run: echo "message=🤖 自动签到更新 $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commit_msg.outputs.message }}
          file_pattern: 'index.md'
          commit_options: '--no-verify'
          skip_dirty_check: true

  # 部署到 GitHub Pages
  deploy:
    needs: checkin
    if: always() && needs.checkin.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
