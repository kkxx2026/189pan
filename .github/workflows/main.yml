# 天翼云盘自动签到（Go 客户端引擎：cloudpan189-go）
name: 天翼云盘签到

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 1,13 * * *'  # 每天 09:30 和 21:30 (北京时间)
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 签到任务
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      success: ${{ steps.checkin.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cloudpan189-go
        run: |
          git clone --depth 1 --branch master https://github.com/tickstep/cloudpan189-go.git "$RUNNER_TEMP/cloudpan-src"
          cd "$RUNNER_TEMP/cloudpan-src"
          go build -o "$RUNNER_TEMP/cloudpan189-go" .

      - name: Run checkin
        id: checkin
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          CLOUD189_CONFIG_DIR: ${{ runner.temp }}/cloud189-config
        run: |
          START_TS=$(date +%s)
          START_STR=$(date '+%Y-%m-%d %H:%M:%S')
          BIN="$RUNNER_TEMP/cloudpan189-go"

          # 登录（调试模式：打开详细日志，失败时提取电信返回的原因）
          # 日志只进临时文件；打印到步骤日志时会打码长串与长数字，登录成功时的昵称行不会出现在这里
          CLOUD189_VERBOSE=1 "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > "$RUNNER_TEMP/login.log" 2>&1 || true
          LOGIN_REASON=""
          if grep -q "登录成功" "$RUNNER_TEMP/login.log"; then
            LOGIN_STATUS="登录成功"
          else
            LOGIN_STATUS="登录失败"
            LOGIN_REASON=$(grep -a -E "panic:|APP登录失败|loginResult|登录失败" "$RUNNER_TEMP/login.log" | tail -2 | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
            echo "----- 登录失败日志（已打码，末尾20行） -----"
            tail -20 "$RUNNER_TEMP/login.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "---------------------------------------------"
          fi

          # 签到 + 抽奖
          SIGN_RESULT=""
          DRAW1=""
          DRAW2=""
          if [ "$LOGIN_STATUS" = "登录成功" ]; then
            "$BIN" sign > "$RUNNER_TEMP/sign.log" 2>&1 || true
            SIGN_RESULT=$(grep -E "签到成功|今日已签到|签到失败" "$RUNNER_TEMP/sign.log" | head -n 1)
            if [ -z "$SIGN_RESULT" ]; then
              SIGN_RESULT="签到失败（无输出）"
            fi
            DRAW1=$(grep -E "第1次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
            DRAW2=$(grep -E "第2次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
          fi

          END_TS=$(date +%s)
          END_STR=$(date '+%Y-%m-%d %H:%M:%S')
          DURATION=$((END_TS - START_TS))

          {
            echo "# 天翼云盘签到记录"
            echo ""
            echo "[![签到状态](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/main.yml) [![项目主页](https://img.shields.io/badge/GitHub-项目主页-blue?logo=github)](https://github.com/${{ github.repository }})"
            echo ""
            echo "**最后更新:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
            echo "## 快速导航"
            echo ""
            echo "- 🔄 [查看Action运行记录](https://github.com/${{ github.repository }}/actions)"
            echo "- 📋 [查看最新运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 🏠 [返回项目主页](https://github.com/${{ github.repository }})"
            echo "- ⚙️ [手动触发签到](https://github.com/${{ github.repository }}/actions/workflows/main.yml)"
            echo ""
            echo "## 签到详情"
            echo ""
            echo "# 天翼云盘自动签到抽奖程序"
            echo ""
            echo "## 执行概览"
            echo "- **启动时间**: $START_STR"
            echo "- **账户数量**: 1 个"
            echo ""
            echo "## 账户1"
            echo ""
            echo "### 执行结果"
            echo "- **登录状态**: $LOGIN_STATUS"
            if [ "$LOGIN_STATUS" = "登录失败" ] && [ -n "$LOGIN_REASON" ]; then
              echo "- **失败原因**: $LOGIN_REASON"
            fi
            echo "- **签到结果**: $SIGN_RESULT"
            if [ -n "$DRAW1" ] || [ -n "$DRAW2" ]; then
              echo "- **抽奖结果**:"
              if [ -n "$DRAW1" ]; then
                echo "  - $DRAW1"
              fi
              if [ -n "$DRAW2" ]; then
                echo "  - $DRAW2"
              fi
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 执行统计"
            echo "- **结束时间**: $END_STR"
            echo "- **运行时长**: ${DURATION} 秒"
            echo ""
            echo "✅ **所有账户处理完成！**"
          } | tee index.md

          if echo "$SIGN_RESULT" | grep -qE "签到成功|今日已签到"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit message
        id: commit_msg
        run: echo "message=🤖 自动签到更新 $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commit_msg.outputs.message }}
          file_pattern: 'index.md'
          commit_options: '--no-verify'
          skip_dirty_check: true

  # 部署到 GitHub Pages
  deploy:
    needs: checkin
    if: always() && needs.checkin.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
