# 天翼云盘自动签到（Go 客户端引擎：cloudpan189-go）
name: 天翼云盘签到

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 1,13 * * *'  # 每天 09:30 和 21:30 (北京时间)
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 签到任务
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      success: ${{ steps.checkin.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cloudpan189-go
        run: |
          git clone --depth 1 --branch master https://github.com/tickstep/cloudpan189-go.git "$RUNNER_TEMP/cloudpan-src"
          cd "$RUNNER_TEMP/cloudpan-src"
          go build -o "$RUNNER_TEMP/cloudpan189-go" .

      - name: Run checkin
        id: checkin
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          CLOUD189_CONFIG_DIR: ${{ runner.temp }}/cloud189-config
        run: |
          START_TS=$(date +%s)
          START_STR=$(date '+%Y-%m-%d %H:%M:%S')
          BIN="$RUNNER_TEMP/cloudpan189-go"

          # 登录 + 签到 + 抽奖（v4：三条命令必须在同一次进程调用里链式执行——login 与 sign 是各自独立的进程，
          # 登录状态只存在于 login 那次运行内，拆成两次调用时 sign 读到的永远是空配置（实测「未登录账号」）；
          # && 链保证只有真登录成功后才执行 sign；整条链的输出进同一份日志，仍只进临时日志不进公开记录）
          CHAIN_LOG="$RUNNER_TEMP/chain.log"
          : > "$CHAIN_LOG"
          LOGIN_OK=false
          for attempt in 1 2; do
            CLOUD189_VERBOSE=1 "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > "$CHAIN_LOG" 2>&1 || true
            if grep -q "登录成功" "$CHAIN_LOG"; then
              LOGIN_OK=true
              break
            fi
            sleep 5
          done
          if [ "$LOGIN_OK" = "true" ]; then
            LOGIN_STATUS="登录成功"
            "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > /dev/null 2>&1 && "$BIN" sign >> "$CHAIN_LOG" 2>&1 || true
          else
            LOGIN_STATUS="登录失败"
          fi
          cp "$CHAIN_LOG" "$RUNNER_TEMP/login.log"
          cp "$CHAIN_LOG" "$RUNNER_TEMP/sign.log"
          LOGIN_REASON=""
          if [ "$LOGIN_STATUS" = "登录失败" ]; then
            LOGIN_REASON=$(grep -a -E "panic:|APP登录失败|loginResult|登录失败" "$RUNNER_TEMP/login.log" | tail -2 | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
            echo "----- 登录失败日志（已打码，末尾20行） -----"
            tail -20 "$RUNNER_TEMP/login.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "---------------------------------------------"
          fi

          # 签到结果提取（v4：签到已在上面的链式调用里执行完，这里只从链日志里提取结果行；
          # 「未登录账号」视为链断裂的异常信号，原样记进签到输出备查）
          SIGN_RESULT=""
          SIGN_DETAIL=""
          DRAW1=""
          DRAW2=""
          if [ "$LOGIN_STATUS" = "登录成功" ]; then
            SIGN_RESULT=$(grep -a -E "签到成功|今日已签到|签到失败" "$RUNNER_TEMP/sign.log" | head -n 1)
            echo "----- 签到输出（已打码，末尾10行） -----"
            tail -10 "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "-----------------------------------------"
            if [ -z "$SIGN_RESULT" ]; then
              SIGN_RESULT="签到失败（无输出）"
              PANIC_HEAD=$(grep -a -m1 -E "^panic:|^fatal error:" "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              if [ -n "$PANIC_HEAD" ]; then
                SIGN_DETAIL="$PANIC_HEAD"
              else
                SIGN_DETAIL=$(tail -5 "$RUNNER_TEMP/sign.log" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              fi
            fi
            DRAW1=$(grep -a -E "第1次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
            DRAW2=$(grep -a -E "第2次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
          fi

          END_TS=$(date +%s)
          END_STR=$(date '+%Y-%m-%d %H:%M:%S')
          DURATION=$((END_TS - START_TS))

          {
            echo "# 天翼云盘签到记录"
            echo ""
            echo "[![签到状态](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/main.yml) [![项目主页](https://img.shields.io/badge/GitHub-项目主页-blue?logo=github)](https://github.com/${{ github.repository }})"
            echo ""
            echo "**最后更新:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
            echo "## 快速导航"
            echo ""
            echo "- 🔄 [查看Action运行记录](https://github.com/${{ github.repository }}/actions)"
            echo "- 📋 [查看最新运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 🏠 [返回项目主页](https://github.com/${{ github.repository }})"
            echo "- ⚙️ [手动触发签到](https://github.com/${{ github.repository }}/actions/workflows/main.yml)"
            echo ""
            echo "## 签到详情"
            echo ""
            echo "# 天翼云盘自动签到抽奖程序"
            echo ""
            echo "## 执行概览"
            echo "- **启动时间**: $START_STR"
            echo "- **账户数量**: 1 个"
            echo ""
            echo "## 账户1"
            echo ""
            echo "### 执行结果"
            echo "- **登录状态**: $LOGIN_STATUS"
            if [ "$LOGIN_STATUS" = "登录失败" ] && [ -n "$LOGIN_REASON" ]; then
              echo "- **失败原因**: $LOGIN_REASON"
            fi
            echo "- **签到结果**: $SIGN_RESULT"
            if [ -n "$SIGN_DETAIL" ]; then
              echo "- **签到输出**: $SIGN_DETAIL"
            fi
            if [ -n "$DRAW1" ] || [ -n "$DRAW2" ]; then
              echo "- **抽奖结果**:"
              if [ -n "$DRAW1" ]; then
                echo "  - $DRAW1"
              fi
              if [ -n "$DRAW2" ]; then
                echo "  - $DRAW2"
              fi
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 执行统计"
            echo "- **结束时间**: $END_STR"
            echo "- **运行时长**: ${DURATION} 秒"
            echo ""
            echo "✅ **所有账户处理完成！**"
          } | tee index.md

          if echo "$SIGN_RESULT" | grep -qE "签到成功|今日已签到"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit message
        id: commit_msg
        run: echo "message=🤖 自动签到更新 $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commit_msg.outputs.message }}
          file_pattern: 'index.md'
          commit_options: '--no-verify'
          skip_dirty_check: true

  # 部署到 GitHub Pages
  deploy:
    needs: checkin
    if: always() && needs.checkin.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
   
