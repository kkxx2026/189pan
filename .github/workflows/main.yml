# 天翼云盘自动签到（Go 客户端引擎：cloudpan189-go）
name: 天翼云盘签到

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '30 1,13 * * *'  # 每天 09:30 和 21:30 (北京时间)
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制执行签到'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 签到任务
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    outputs:
      success: ${{ steps.checkin.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cloudpan189-go (v11：签到进程开启诊断日志）
        run: |
          set -e
          git clone --depth 1 --branch master https://github.com/tickstep/cloudpan189-go.git "$RUNNER_TEMP/cloudpan-src"
          cd "$RUNNER_TEMP/cloudpan-src"
          # ---- 客户端补丁（对象：cloudpan189-go master 克隆件）
          # 第 1 处（v9）：internal/config/pan_config.go 的 ActiveUser() 恢复用户时，
          #   SetupUserByCookie 失败就判死刑（GetUserInfo 是网页接口，依赖网页 cookie，
          #   在 Actions 里时好时坏）。改为：电脑客户端会话（SessionKey）仍在时，
          #   直接以 app 会话恢复已存用户（UID/昵称保留），签到只用 SessionKey。
          # 第 2 处（v9）：main.go 的 checkLoginExpiredAndRelogin() 原来每次调用都重登
          #   （UID != 0 恒真），改为只有确实没有可用用户时才重登。
          # 第 3 处（v10）：internal/config/pan_user.go 的 SetupUserByCookie 里，
          #   GetUserInfo 通过后还要过 GetUserDetailInfo（网页 /v2/ 接口）这一关，
          #   失败照样整个返回错误——#13 实测：前两处补丁生效后，前两关已过，
          #   死在这一关（同一 cookie 几秒前刚通过 GetUserInfo，详情接口却拒，
          #   疑似有并发限制）。改为：详情拉不到但 SessionKey 在，直接返回已构造
          #   的用户（UID/昵称在这一关之前就已写入），性别资料对签到无用。
          # v11 说明：客户端三处补丁一处未动；改动只在 Run checkin 步骤——
          #   签到进程也开 CLOUD189_VERBOSE=1、单独留日志并把脱敏日志尾带进
          #   记录的「签到日志」行，一趟看清死在哪一关（见下方运行步骤注释）。
          python3 - "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" "$RUNNER_TEMP/cloudpan-src/main.go" "$RUNNER_TEMP/cloudpan-src/internal/config/pan_user.go" <<'PYEOF2'
          import sys
          pan_path, main_path, user_path = sys.argv[1], sys.argv[2], sys.argv[3]
          src = open(pan_path).read()
          old_a = '\t\t\t\tif u.PanClient() == nil {\n\t\t\t\t\t// restore client\n\t\t\t\t\tuser, err := SetupUserByCookie(&u.WebToken, &u.AppToken)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\tlogger.Verboseln("setup user error")\n\t\t\t\t\t\treturn nil\n\t\t\t\t\t}\n\t\t\t\t\tu.panClient = user.panClient\n\t\t\t\t\tu.Nickname = user.Nickname\n'
          new_a = '\t\t\t\tif u.PanClient() == nil {\n\t\t\t\t\t// restore client\n\t\t\t\t\tuser, err := SetupUserByCookie(&u.WebToken, &u.AppToken)\n\t\t\t\t\tif err != nil {\n\t\t\t\t\t\t// 网页侧校验失败时，若电脑客户端会话仍在，直接以 app 会话恢复：\n\t\t\t\t\t\t// 签到只用 SessionKey，不依赖网页 cookie；这里返回已存的用户\n\t\t\t\t\t\t//（UID 与昵称都保留），而不是在恢复处就判死刑\n\t\t\t\t\t\tif u.AppToken.SessionKey != "" {\n\t\t\t\t\t\t\tlogger.Verboseln("setup user by cookie failed, restore with app session only")\n\t\t\t\t\t\t\tu.panClient = cloudpan.NewPanClient(u.WebToken, u.AppToken)\n\t\t\t\t\t\t} else {\n\t\t\t\t\t\t\tlogger.Verboseln("setup user error")\n\t\t\t\t\t\t\treturn nil\n\t\t\t\t\t\t}\n\t\t\t\t\t} else {\n\t\t\t\t\t\tu.panClient = user.panClient\n\t\t\t\t\t\tu.Nickname = user.Nickname\n\t\t\t\t\t}\n'
          if src.count(old_a) != 1:
              sys.exit('pan_config.go: 恢复兜底锚点未命中，中止')
          open(pan_path, 'w').write(src.replace(old_a, new_a))
          print('pan_config.go: 恢复兜底已应用')
          src = open(main_path).read()
          old_b = '\tactiveUser := config.Config.ActiveUser()\n\tif activeUser == nil || activeUser.UID != 0 {\n\t\t// maybe expired, try to login\n\t\tcmder.TryLogin()\n\t}\n'
          new_b = '\tactiveUser := config.Config.ActiveUser()\n\tif activeUser == nil {\n\t\t// 只有确实没有可用用户时才重登：已存用户不要每次都重登——\n\t\t// 新登录会顶掉已存的网页会话，且其网页兜底本就时好时坏；\n\t\t// 自动化流程里登录步骤已在签到前刚刷新过会话，这里不再动它\n\t\tcmder.TryLogin()\n\t}\n'
          if src.count(old_b) != 1:
              sys.exit('main.go: 重登条件锚点未命中，中止')
          open(main_path, 'w').write(src.replace(old_b, new_b))
          print('main.go: 重登条件已收紧')
          src = open(user_path).read()
          old_c = '\tuserDetailInfo, err := panClient.GetUserDetailInfo()\n\tif userDetailInfo != nil {\n'
          new_c = '\tuserDetailInfo, err := panClient.GetUserDetailInfo()\n\tif userDetailInfo == nil && appToken.SessionKey != "" {\n\t\t// 网页侧详情接口失败但电脑客户端会话仍在：不要判死刑——\n\t\t// 签到只用 SessionKey，性别等资料对签到无用，直接以 app 会话返回用户\n\t\tlogger.Verboseln("get user detail info failed, continue with app session only")\n\t\treturn u, nil\n\t}\n\tif userDetailInfo != nil {\n'
          if src.count(old_c) != 1:
              sys.exit('pan_user.go: 详情关口锚点未命中，中止')
          open(user_path, 'w').write(src.replace(old_c, new_c))
          print('pan_user.go: 详情关口兜底已应用')
          PYEOF2
          grep -q 'restore with app session only' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_config.go" || { echo "❌ 恢复兜底缺失，中止"; exit 1; }
          grep -q 'if activeUser == nil {' "$RUNNER_TEMP/cloudpan-src/main.go" || { echo "❌ 重登条件未收紧，中止"; exit 1; }
          grep -q 'get user detail info failed, continue with app session only' "$RUNNER_TEMP/cloudpan-src/internal/config/pan_user.go" || { echo "❌ 详情关口兜底缺失，中止"; exit 1; }
          echo "✅ 客户端三处补丁已应用（恢复兜底 + 重登收紧 + 详情关口兜底）"
          # --- 补丁总览（对象：cloudpan189-api v0.1.0，已审计版本）
          # 第一层（v7）：两个登录参数刮取器共 10 处 FindStringSubmatch(content)[1]
          #   无保护，页面缺字段即崩（index out of range [1]）→ 全部改为带长度保护。
          # 第二层（v8 新增）：login.go 的 LoginWithCaptcha 在 doLoginAct 返回
          #   (nil 结果, nil 错误) 时 err.Error() 解引用空指针崩溃 → 先判 err、
          #   再单独判结果为空，改为干净返回登录失败。
          # 第三层（v8 新增）：appGetLoginParams 整体加 recover 兜底 + 必需字段
          #   （jRsaKey/Lt/ReturnUrl/ParamId/ReqId）缺一即返回「登录参数不完整」错误，
          #   不再带着空参数往下走、把小问题拖成崩溃。
          curl -fsSL "https://raw.githubusercontent.com/tickstep/cloudpan189-api/v0.1.0/cloudpan/app_login.go" -o "$RUNNER_TEMP/app_login.go"
          curl -fsSL "https://raw.githubusercontent.com/tickstep/cloudpan189-api/v0.1.0/cloudpan/login.go" -o "$RUNNER_TEMP/login.go"
          GOMODCACHE="$(go env GOMODCACHE)"
          LIBDIR="$GOMODCACHE/github.com/tickstep/cloudpan189-api@v0.1.0/cloudpan"
          if [ ! -d "$LIBDIR" ]; then go mod download github.com/tickstep/cloudpan189-api; fi
          [ -d "$LIBDIR" ] || { echo "❌ 找不到 cloudpan189-api v0.1.0 源码目录，补丁中止"; exit 1; }
          chmod -R u+w "$GOMODCACHE/github.com/tickstep/cloudpan189-api@v0.1.0"
          cp "$RUNNER_TEMP/app_login.go" "$LIBDIR/app_login.go"
          cp "$RUNNER_TEMP/login.go" "$LIBDIR/login.go"
          python3 - "$LIBDIR/app_login.go" 6 "$LIBDIR/login.go" 4 <<'PYEOF'
          import re, sys
          args = sys.argv[1:]
          PAT = re.compile(r'^\tparams\.(\w+) = re\.FindStringSubmatch\(content\)\[1\]$')
          for i in range(0, len(args), 2):
              path, expect = args[i], int(args[i+1])
              out, n = [], 0
              for line in open(path).read().split('\n'):
                  m = PAT.match(line)
                  if m:
                      f = m.group(1)
                      out.append('\tif m := re.FindStringSubmatch(content); len(m) > 1 {')
                      out.append('\t\tparams.%s = m[1]' % f)
                      out.append('\t}')
                      n += 1
                  else:
                      out.append(line)
              if n != expect:
                  sys.exit('%s: 预期补丁 %d 处，实际 %d 处，中止' % (path, expect, n))
              open(path, 'w').write('\n'.join(out))
              print('%s: 已加保护 %d 处' % (path, n))
          # ---- v8 第二层：LoginWithCaptcha 空指针守卫（login.go）----
          login_path = args[2]
          src = open(login_path).read()
          old = '\tr, err := doLoginAct(username, password, captchaCode, latestLoginParams.CaptchaToken,\n\t\tlatestLoginParams.ReturnUrl, latestLoginParams.ParamId, latestLoginParams.Lt)\n\tif err != nil || r.Msg != "登录成功" {\n\t\tlogger.Verboseln("login failed ", err)\n\t\treturn webToken, apierror.NewFailedApiError(err.Error())\n\t}'
          new = '\tr, err := doLoginAct(username, password, captchaCode, latestLoginParams.CaptchaToken,\n\t\tlatestLoginParams.ReturnUrl, latestLoginParams.ParamId, latestLoginParams.Lt)\n\tif err != nil {\n\t\tlogger.Verboseln("login failed ", err)\n\t\treturn webToken, apierror.NewFailedApiError(err.Error())\n\t}\n\tif r == nil || r.Msg != "登录成功" {\n\t\tlogger.Verboseln("login failed: unexpected result")\n\t\treturn webToken, apierror.NewFailedApiError("登录失败")\n\t}'
          if src.count(old) != 1:
              sys.exit('login.go: 空指针守卫锚点未命中，中止')
          open(login_path, 'w').write(src.replace(old, new))
          print('login.go: 空指针守卫已应用')
          # ---- v8 第三层：appGetLoginParams recover + 必需字段校验（app_login.go）----
          app_path = args[0]
          src = open(app_path).read()
          anchor = '\tcontent := string(data)\n\n\tre, _ := regexp.Compile("captchaToken\' value=\'(.+?)\'")'
          repl = '\tcontent := string(data)\n\tdefer func() {\n\t\tif rec := recover(); rec != nil {\n\t\t\tparams = appLoginParams{}\n\t\t\terror = apierror.NewFailedApiError("登录参数抓取异常")\n\t\t}\n\t}()\n\n\tre, _ := regexp.Compile("captchaToken\' value=\'(.+?)\'")'
          if src.count(anchor) != 1:
              sys.exit('app_login.go: recover 锚点未命中，中止')
          src = src.replace(anchor, repl)
          tail = '\tparams.jRsaKey = m[1]\n\t}\n\treturn\n}'
          tail_new = '\tparams.jRsaKey = m[1]\n\t}\n\tif params.jRsaKey == "" || params.Lt == "" || params.ReturnUrl == "" || params.ParamId == "" || params.ReqId == "" {\n\t\treturn params, apierror.NewFailedApiError("登录参数不完整")\n\t}\n\treturn\n}'
          if src.count(tail) != 1:
              sys.exit('app_login.go: 字段校验锚点未命中，中止')
          open(app_path, 'w').write(src.replace(tail, tail_new))
          print('app_login.go: recover 兜底 + 必需字段校验已应用')
          PYEOF
          if grep -rn "FindStringSubmatch(content)\[1\]" "$LIBDIR/app_login.go" "$LIBDIR/login.go" > /dev/null; then
            echo "❌ 仍有未加保护的抓取，补丁不完整，中止"
            exit 1
          fi
          grep -q 'r == nil || r.Msg' "$LIBDIR/login.go" || { echo "❌ 空指针守卫缺失，中止"; exit 1; }
          grep -q '登录参数不完整' "$LIBDIR/app_login.go" || { echo "❌ 字段校验缺失，中止"; exit 1; }
          echo "✅ v11 基线补丁已全部应用（客户端 3 处 + 抓取保护 10 处 + 空指针守卫 + recover/字段校验；v11 改动在运行步骤）"
          go build -o "$RUNNER_TEMP/cloudpan189-go" .

      - name: Run checkin
        id: checkin
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          CLOUD189_CONFIG_DIR: ${{ runner.temp }}/cloud189-config
        run: |
          START_TS=$(date +%s)
          START_STR=$(date '+%Y-%m-%d %H:%M:%S')
          BIN="$RUNNER_TEMP/cloudpan189-go"

          # 登录 + 签到 + 抽奖（v11：链式调用与整链重试 3 次不变；
          # 修复都在 Build 步骤的补丁里——v7/v8 的抓取保护、空指针守卫、
          # recover/字段校验不变；v9 补「恢复时网页校验失败走 app 会话兜底 +
          # 仅无用户时重登」；v10 再补「详情关口同样兜底」。
          # v11 只改观测：签到进程也开 CLOUD189_VERBOSE=1、单独写入 SIGN_LOG，
          # 并把脱敏日志尾带进记录的「签到日志」行——死在哪一关一趟看清，
          # 不再靠猜。）
          CHAIN_LOG="$RUNNER_TEMP/chain.log"
          SIGN_LOG="$RUNNER_TEMP/sign-verbose.log"
          : > "$CHAIN_LOG"
          : > "$SIGN_LOG"
          LOGIN_OK=false
          for attempt in 1 2; do
            CLOUD189_VERBOSE=1 "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > "$CHAIN_LOG" 2>&1 || true
            if grep -q "登录成功" "$CHAIN_LOG"; then
              LOGIN_OK=true
              break
            fi
            sleep 5
          done
          if [ "$LOGIN_OK" = "true" ]; then
            LOGIN_STATUS="登录成功"
            for attempt in 1 2 3; do
              "$BIN" login -username="$TYYP_USERNAME" -password="$TYYP_PSW" > /dev/null 2>&1 && CLOUD189_VERBOSE=1 "$BIN" sign > "$SIGN_LOG" 2>&1 || true
              cat "$SIGN_LOG" >> "$CHAIN_LOG"
              if grep -a -q -E "签到成功|今日已签到|签到失败" "$CHAIN_LOG"; then
                break
              fi
              sleep 5
            done
          else
            LOGIN_STATUS="登录失败"
          fi
          cp "$CHAIN_LOG" "$RUNNER_TEMP/login.log"
          cp "$CHAIN_LOG" "$RUNNER_TEMP/sign.log"
          LOGIN_REASON=""
          if [ "$LOGIN_STATUS" = "登录失败" ]; then
            LOGIN_REASON=$(grep -a -E "panic:|APP登录失败|loginResult|登录失败" "$RUNNER_TEMP/login.log" | tail -2 | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
            echo "----- 登录失败日志（已打码，末尾20行） -----"
            tail -20 "$RUNNER_TEMP/login.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "---------------------------------------------"
          fi

          # 签到结果提取（v4：签到已在上面的链式调用里执行完，这里只从链日志里提取结果行；
          # 「未登录账号」视为链断裂的异常信号，原样记进签到输出备查）
          SIGN_RESULT=""
          SIGN_DETAIL=""
          DRAW1=""
          DRAW2=""
          if [ "$LOGIN_STATUS" = "登录成功" ]; then
            SIGN_RESULT=$(grep -a -E "签到成功|今日已签到|签到失败" "$RUNNER_TEMP/sign.log" | head -n 1)
            echo "----- 签到输出（已打码，末尾10行） -----"
            tail -10 "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g'
            echo "-----------------------------------------"
            if [ -z "$SIGN_RESULT" ]; then
              SIGN_RESULT="签到失败（无输出）"
              PANIC_HEAD=$(grep -a -m1 -E "^panic:|^fatal error:" "$RUNNER_TEMP/sign.log" | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              if [ -n "$PANIC_HEAD" ]; then
                SIGN_DETAIL="$PANIC_HEAD"
              else
                SIGN_DETAIL=$(tail -5 "$RUNNER_TEMP/sign.log" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-180)
              fi
            fi
            DRAW1=$(grep -a -E "第1次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
            DRAW2=$(grep -a -E "第2次抽奖" "$RUNNER_TEMP/sign.log" | head -n 1)
          fi
          # v11 诊断：签到进程的 verbose 日志尾（脱敏）带进记录，一趟看清死点
          SIGN_TAIL=""
          if [ -s "$SIGN_LOG" ]; then
            SIGN_TAIL=$(tail -8 "$SIGN_LOG" | tr '\n' ' ' | sed -E 's/[0-9a-fA-F]{24,}/***/g; s/[0-9]{7,}/***/g' | cut -c1-500)
          fi

          END_TS=$(date +%s)
          END_STR=$(date '+%Y-%m-%d %H:%M:%S')
          DURATION=$((END_TS - START_TS))

          {
            echo "# 天翼云盘签到记录"
            echo ""
            echo "[![签到状态](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/main.yml) [![项目主页](https://img.shields.io/badge/GitHub-项目主页-blue?logo=github)](https://github.com/${{ github.repository }})"
            echo ""
            echo "**最后更新:** $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
            echo "## 快速导航"
            echo ""
            echo "- 🔄 [查看Action运行记录](https://github.com/${{ github.repository }}/actions)"
            echo "- 📋 [查看最新运行](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 🏠 [返回项目主页](https://github.com/${{ github.repository }})"
            echo "- ⚙️ [手动触发签到](https://github.com/${{ github.repository }}/actions/workflows/main.yml)"
            echo ""
            echo "## 签到详情"
            echo ""
            echo "# 天翼云盘自动签到抽奖程序"
            echo ""
            echo "## 执行概览"
            echo "- **启动时间**: $START_STR"
            echo "- **账户数量**: 1 个"
            echo ""
            echo "## 账户1"
            echo ""
            echo "### 执行结果"
            echo "- **登录状态**: $LOGIN_STATUS"
            if [ "$LOGIN_STATUS" = "登录失败" ] && [ -n "$LOGIN_REASON" ]; then
              echo "- **失败原因**: $LOGIN_REASON"
            fi
            echo "- **签到结果**: $SIGN_RESULT"
            if [ -n "$SIGN_DETAIL" ]; then
              echo "- **签到输出**: $SIGN_DETAIL"
            fi
            if [ -n "$SIGN_TAIL" ]; then
              echo "- **签到日志**: $SIGN_TAIL"
            fi
            if [ -n "$DRAW1" ] || [ -n "$DRAW2" ]; then
              echo "- **抽奖结果**:"
              if [ -n "$DRAW1" ]; then
                echo "  - $DRAW1"
              fi
              if [ -n "$DRAW2" ]; then
                echo "  - $DRAW2"
              fi
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 执行统计"
            echo "- **结束时间**: $END_STR"
            echo "- **运行时长**: ${DURATION} 秒"
            echo ""
            echo "✅ **所有账户处理完成！**"
          } | tee index.md

          if echo "$SIGN_RESULT" | grep -qE "签到成功|今日已签到"; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit message
        id: commit_msg
        run: echo "message=🤖 自动签到更新 $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ steps.commit_msg.outputs.message }}
          file_pattern: 'index.md'
          commit_options: '--no-verify'
          skip_dirty_check: true

  # 部署到 GitHub Pages
  deploy:
    needs: checkin
    if: always() && needs.checkin.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
